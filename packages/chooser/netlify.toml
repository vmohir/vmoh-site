[build]
  command = "pnpm run build"
  publish = "dist"
  # Base = packages/chooser, so this runs with that as cwd — pathspecs must be
  # relative to it ("." for the package itself) or root-anchored with :/ (the
  # shared workspace files). Plain "packages/chooser" here silently resolved
  # to a nonexistent nested path and made every automatic deploy look like "no
  # content change".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . :/pnpm-lock.yaml :/pnpm-workspace.yaml :/package.json"

# Override Netlify's default Permissions-Policy header — it lists several ad-
# tech features that current Chromium versions no longer recognise, which
# produces noisy console warnings.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

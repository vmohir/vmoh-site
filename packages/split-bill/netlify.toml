# example netlify.toml
#
# netlify/functions/share.ts requires UPSTASH_REDIS_REST_URL and
# UPSTASH_REDIS_REST_TOKEN (free tier at upstash.com) to be set as site
# environment variables in the Netlify dashboard. Without them, share links
# fall back to the offline, fully-encoded-in-the-URL format.
[build]
  command = "pnpm run build"
  functions = "netlify/functions"
  publish = "dist"
  # Base = packages/split-bill, so this runs with that as cwd — pathspecs must
  # be relative to it ("." for the package itself) or root-anchored with :/
  # (the shared workspace files). Plain "packages/split-bill" here silently
  # resolved to a nonexistent nested path and made every automatic deploy
  # look like "no content change".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . :/pnpm-lock.yaml :/pnpm-workspace.yaml :/package.json"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config
